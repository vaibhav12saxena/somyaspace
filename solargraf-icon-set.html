<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solargraf Icon Set · Case Study</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
:root {
  --bg: #f5f2f0;
  --text: #3c3c3c;
  --text2: #777575;
  --accent: #f3731f;
  --tag-bg: #f0f0eb;
  --card-bg: #ffffff;
  --card-shadow: 0px 2px 12px 0px rgba(0,0,0,0.06);
  --divider: #d9d9d9;
}
body { font-family:'Bricolage Grotesque',sans-serif; background:var(--bg); color:var(--text); overflow-x:hidden; line-height:1.7; }

.top-bar { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:0 48px; height:56px; background:rgba(245,242,240,0.92); backdrop-filter:blur(16px); border-bottom:1px solid rgba(0,0,0,0.06); }
.top-bar a { color:var(--text2); text-decoration:none; font-size:14px; font-family:'Ubuntu',sans-serif; transition:color 0.3s ease; }
.top-bar a:hover { color:var(--accent); }
.top-bar .back-link { font-weight:700; display:flex; align-items:center; gap:6px; color:var(--text); font-family:'Bricolage Grotesque',sans-serif; }
.nav-links { display:flex; gap:24px; }
.scroll-progress { position:fixed; top:56px; left:0; height:2px; background:var(--accent); z-index:101; width:0; transition:width 0.1s linear; }

.cs-section { max-width:1200px; margin:0 auto; padding:48px 32px; }
.cs-full { width:100%; }

.hero { min-height:100vh; display:flex; align-items:center; justify-content:center; padding-top:56px; overflow:hidden; }
.hero-img { width:100%; max-width:1200px; margin:0 auto; display:block; }

.section-img { width:100%; display:block; border-radius:20px; box-shadow:0 4px 24px rgba(0,0,0,0.08); }
.section-img-full { width:100%; display:block; }

.section-wrap { margin-bottom:0; }
.section-wrap + .section-wrap { margin-top:0; }

.reveal { opacity:0; transform:translateY(32px); transition:opacity 0.7s ease, transform 0.7s ease; }
.reveal.visible { opacity:1; transform:translateY(0); }

.case-footer { text-align:center; padding:48px 32px; font-family:'Ubuntu',sans-serif; font-size:16px; color:var(--text2); }
.case-footer a { color:var(--accent); text-decoration:none; }

@media (max-width:960px) {
  .top-bar { padding:0 24px; }
  .cs-section { padding:64px 20px; }
  .nav-links { display:none; }
  .section-img { border-radius:12px; }
}
@media (max-width:480px) {
  .cs-section { padding:48px 16px; }
  .section-img { border-radius:8px; }
}
</style>
</head>
<body>

<nav class="top-bar">
  <a href="index.html" class="back-link">← Back</a>
  <div class="nav-links">
    <a href="#sec-context">Context</a>
    <a href="#sec-need">The Need</a>
    <a href="#sec-impact">Impact</a>
    <a href="#sec-icons">Icon Set</a>
    <a href="#sec-checklist">Checklist</a>
    <a href="#sec-comparison">Comparison</a>
    <a href="#sec-process">Process</a>
    <a href="#sec-learnings">Learnings</a>
  </div>
</nav>
<div class="scroll-progress" id="scrollProgress"></div>

<!-- HERO -->
<section class="hero">
  <img src="Images/iconography/hero.png" alt="Redesigning Iconography for Solargraf" class="hero-img">
</section>

<!-- CONTEXT -->
<section class="cs-section section-wrap case-sec" id="sec-context">
  <div class="reveal">
    <img src="Images/iconography/context.png" alt="Solargraf context and product overview" class="section-img">
  </div>
</section>

<!-- WHAT'S THE NEED -->
<section class="cs-section section-wrap case-sec" id="sec-need">
  <div class="reveal">
    <img src="Images/iconography/need.png" alt="What is the need for icon redesign" class="section-img">
  </div>
</section>

<!-- IMPACT -->
<section class="cs-section section-wrap case-sec" id="sec-impact">
  <div class="reveal">
    <img src="Images/iconography/impact.png" alt="The impact of the icon redesign project" class="section-img">
  </div>
</section>

<!-- ICON SET -->
<section class="cs-section section-wrap case-sec" id="sec-icons">
  <div class="reveal">
    <img src="Images/iconography/icon-set.png" alt="The redesigned icon set organized by product area" class="section-img">
  </div>
</section>

<!-- CHECKLIST -->
<section class="cs-section section-wrap case-sec" id="sec-checklist">
  <div class="reveal">
    <img src="Images/iconography/checklist.png" alt="Design checklist and icon anatomy rules" class="section-img">
  </div>
</section>

<!-- QUICK COMPARISON -->
<section class="cs-section section-wrap case-sec" id="sec-comparison">
  <div class="reveal">
    <img src="Images/iconography/comparison.png" alt="Before and after icon comparison" class="section-img">
  </div>
</section>

<!-- PROCESS -->
<section class="cs-section section-wrap case-sec" id="sec-process">
  <div class="reveal">
    <img src="Images/iconography/process.png" alt="Icon design process phases and iterations" class="section-img">
  </div>
</section>

<!-- FIGMA VS ILLUSTRATOR -->
<section class="cs-section section-wrap case-sec" id="sec-tools">
  <div class="reveal">
    <img src="Images/iconography/figma-vs-illustrator.png" alt="Figma vs Illustrator workflow decisions" class="section-img">
  </div>
</section>

<!-- KEY LEARNINGS -->
<section class="cs-section section-wrap case-sec" id="sec-learnings">
  <div class="reveal">
    <img src="Images/iconography/key-learnings.png" alt="Key learnings from the icon redesign project" class="section-img">
  </div>
</section>

<footer class="case-footer">
  <p>Thank you for your time, if you have feedback please reach out</p>
</footer>

<script>
const obs = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
}, { threshold: 0.08 });
document.querySelectorAll('.reveal').forEach(el => obs.observe(el));

const bar = document.getElementById('scrollProgress');
window.addEventListener('scroll', () => {
  const h = document.documentElement.scrollHeight - window.innerHeight;
  bar.style.width = (window.scrollY / h * 100) + '%';
});

const sections = document.querySelectorAll('.case-sec');
const navLinks = document.querySelectorAll('.nav-links a');
window.addEventListener('scroll', () => {
  let cur = '';
  sections.forEach(s => { if (window.scrollY >= s.offsetTop - 200) cur = s.getAttribute('id'); });
  navLinks.forEach(a => { a.style.color = a.getAttribute('href') === '#' + cur ? 'var(--accent)' : ''; });
});
</script>
</body>
</html>
